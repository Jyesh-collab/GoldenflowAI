  <!-- ===== PHASE 0 ===== -->
  <circle cx="82" cy="232" r="15" fill="#94a3b8"/><text x="82" y="238" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">0</text>
  <text x="108" y="227" font-size="16.5" font-weight="700" fill="#1f2d5a">Foundation &amp; Readiness</text>
  <text x="108" y="248" font-size="12.5" fill="#7d8aa3">Readiness audit &#183; taxonomy &#183; baselines &#183; privacy</text>
  <text x="82" y="259" font-size="10" font-weight="600" fill="#9aa5b8" text-anchor="middle">3.5 FTE</text>
  <g filter="url(#s2)"><rect x="430" y="211" width="100" height="42" rx="7" fill="#94a3b8"/></g>
  <text x="558" y="237" font-size="12" font-weight="600" fill="#64748b">Go / No-Go decision</text>

  <!-- ===== PHASE 1 ===== -->
  <circle cx="82" cy="314" r="15" fill="#7c5cf0"/><text x="82" y="320" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="108" y="309" font-size="16.5" font-weight="700" fill="#1f2d5a">Data Foundation</text>
  <text x="108" y="330" font-size="12.5" fill="#7d8aa3">RudderStack &#183; SDKs &#183; event store &#183; data quality</text>
  <text x="82" y="341" font-size="10" font-weight="600" fill="#9aa5b8" text-anchor="middle">5.5 FTE</text>
  <g filter="url(#s2)"><rect x="480" y="293" width="200" height="42" rx="7" fill="#7c5cf0"/></g>
  <text x="496" y="319" font-size="12.5" font-weight="600" fill="#ffffff">Single source of truth</text>

  <!-- ===== PHASE 2 ===== -->
  <circle cx="82" cy="396" r="15" fill="#1fa06b"/><text x="82" y="402" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="108" y="391" font-size="16.5" font-weight="700" fill="#1f2d5a">Journey Intelligence Engine</text>
  <text x="108" y="412" font-size="12.5" fill="#7d8aa3">PM4Py mining &#183; clustering &#183; scoring &#183; drift</text>
  <text x="82" y="423" font-size="10" font-weight="600" fill="#9aa5b8" text-anchor="middle">5 FTE</text>
  <g filter="url(#s2)"><rect x="580" y="375" width="250" height="42" rx="7" fill="#1fa06b"/></g>
  <text x="596" y="401" font-size="12.5" font-weight="600" fill="#ffffff">Golden Journey catalogue &#8212; Agent 1</text>

  <!-- ===== PHASE 3 ===== -->
  <circle cx="82" cy="478" r="15" fill="#10b981"/><text x="82" y="484" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="108" y="473" font-size="16.5" font-weight="700" fill="#1f2d5a">QA Asset Graph &amp; Gap Analysis</text>
  <text x="108" y="494" font-size="12.5" fill="#7d8aa3">Suite parsers &#183; coverage graph &#183; gap diff</text>
  <text x="82" y="505" font-size="10" font-weight="600" fill="#9aa5b8" text-anchor="middle">5 FTE</text>
  <g filter="url(#s2)"><rect x="730" y="457" width="200" height="42" rx="7" fill="#10b981"/></g>
  <text x="958" y="483" font-size="12" font-weight="700" fill="#0f8a5f">First standalone value</text>

  <!-- ===== PHASE 4 ===== -->
  <circle cx="82" cy="560" r="15" fill="#e0a51a"/><text x="82" y="566" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text>
  <text x="108" y="555" font-size="16.5" font-weight="700" fill="#1f2d5a">Locator Resolution</text>
  <text x="108" y="576" font-size="12.5" fill="#7d8aa3">POM resolver &#183; Robo crawl &#183; self-healing</text>
  <text x="82" y="587" font-size="10" font-weight="600" fill="#9aa5b8" text-anchor="middle">4 FTE</text>
  <g filter="url(#s2)"><rect x="830" y="539" width="200" height="42" rx="7" fill="#e0a51a"/></g>
  <text x="846" y="565" font-size="12.5" font-weight="600" fill="#ffffff">Journeys become executable</text>

  <!-- ===== PHASE 5 ===== -->
  <circle cx="82" cy="642" r="15" fill="#2563eb"/><text x="82" y="648" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">5</text>
  <text x="108" y="637" font-size="16.5" font-weight="700" fill="#1f2d5a">Generation &amp; Validation</text>
  <text x="108" y="658" font-size="12.5" fill="#7d8aa3">Codegen &#183; device-farm gate &#183; PR workflow</text>
  <text x="82" y="669" font-size="10" font-weight="600" fill="#9aa5b8" text-anchor="middle">5 FTE</text>
  <g filter="url(#s2)"><rect x="930" y="621" width="250" height="42" rx="7" fill="#2563eb"/></g>
  <text x="946" y="647" font-size="12.5" font-weight="600" fill="#ffffff">Validated automation &#8212; Agent 2</text>

  <!-- ===== PHASE 6 ===== -->
  <circle cx="82" cy="724" r="15" fill="#6d5ce7"/><text x="82" y="730" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">6</text>
  <text x="108" y="719" font-size="16.5" font-weight="700" fill="#1f2d5a">Closed Loop &amp; Governance</text>
  <text x="108" y="740" font-size="12.5" fill="#7d8aa3">Outcome tracking &#183; auto-tune &#183; audit lineage</text>
  <text x="82" y="751" font-size="10" font-weight="600" fill="#9aa5b8" text-anchor="middle">4.5 FTE</text>
  <g filter="url(#s2)"><rect x="1080" y="703" width="250" height="42" rx="7" fill="#6d5ce7"/></g>
  <text x="1096" y="729" font-size="12.5" font-weight="600" fill="#ffffff">The system measures itself</text>

  <!-- ===== PHASE 7 ===== -->
  <circle cx="82" cy="806" r="15" fill="#0f766e"/><text x="82" y="812" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">7</text>
  <text x="108" y="801" font-size="16.5" font-weight="700" fill="#1f2d5a">Multi-App Scale &amp; Productization</text>
  <text x="108" y="822" font-size="12.5" fill="#7d8aa3">Multi-tenancy &#183; onboarding &#183; connectors &#183; SLAs</text>
  <text x="82" y="833" font-size="10" font-weight="600" fill="#9aa5b8" text-anchor="middle">6.5 FTE</text>
  <g filter="url(#s2)"><rect x="1230" y="785" width="400" height="42" rx="7" fill="#0f766e"/></g>
  <text x="1246" y="811" font-size="12.5" font-weight="600" fill="#ffffff">Adoptable across the organisation</text>

