  <text x="60" y="50" font-size="31" font-weight="700" fill="#ffffff">GoldenFlow AI &#8212; Product Roadmap</text>
  <text x="60" y="82" font-size="15" fill="#c3d0ea">Full product build-out &#183; 8 phases &#183; ~18 months to GA, ~24 months to org-wide adoption</text>
  <text x="1640" y="50" font-size="13" fill="#9fb2d8" text-anchor="end">Phases overlap deliberately &#8212;</text>
  <text x="1640" y="72" font-size="13" fill="#9fb2d8" text-anchor="end">bars are staffing windows, not hard gates</text>

