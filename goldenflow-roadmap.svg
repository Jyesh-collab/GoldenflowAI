  <text x="84" y="951" font-size="14.5" font-weight="700" fill="#1f2d5a">M2 &#183; Instrumentation gate</text>
  <text x="84" y="975" font-size="12" fill="#5c6b85">Readiness &#8805; 70% on a pilot app. If the</text>
  <text x="84" y="993" font-size="12" fill="#5c6b85">app cannot be mined, that is a valid</text>
  <text x="84" y="1011" font-size="12" fill="#5c6b85">outcome &#8212; found cheaply, not late.</text>

  <text x="412" y="951" font-size="14.5" font-weight="700" fill="#1f2d5a">M5 &#183; Data quality gate</text>
  <text x="412" y="975" font-size="12" fill="#5c6b85">&#8805; 90% screen coverage, zero PII in a</text>
  <text x="412" y="993" font-size="12" fill="#5c6b85">1,000-session audit. Garbage here</text>
  <text x="412" y="1011" font-size="12" fill="#5c6b85">becomes confident nonsense later.</text>

  <text x="740" y="951" font-size="14.5" font-weight="700" fill="#1f2d5a">M10 &#183; Trust gate</text>
  <text x="740" y="975" font-size="12" fill="#5c6b85">&#8805; 75% of reported gaps confirmed real</text>
  <text x="740" y="993" font-size="12" fill="#5c6b85">by QE leads. Insight ships before</text>
  <text x="740" y="1011" font-size="12" fill="#5c6b85">generation &#8212; it earns Phase 5 credit.</text>

  <text x="1068" y="951" font-size="14.5" font-weight="700" fill="#1f2d5a">M15 &#183; Quality gate</text>
  <text x="1068" y="975" font-size="12" fill="#5c6b85">&#8805; 60% of generated PRs merged</text>
  <text x="1068" y="993" font-size="12" fill="#5c6b85">unmodified, flake rate at or below the</text>
  <text x="1068" y="1011" font-size="12" fill="#5c6b85">existing suite. Zero unreviewed commits.</text>

  <text x="1396" y="951" font-size="14.5" font-weight="700" fill="#1f2d5a">M18 &#183; Value gate</text>
  <text x="1396" y="975" font-size="12" fill="#5c6b85">Measured escaped-defect reduction</text>
  <text x="1396" y="993" font-size="12" fill="#5c6b85">against the Phase 0 baseline. No</text>
  <text x="1396" y="1011" font-size="12" fill="#5c6b85">baseline, no claim.</text>
